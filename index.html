<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Women in Tech | GDG on Campus TUM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Women in Tech at GDG on Campus, Technical University of Mombasa. Every Monday. Every track. Women in front.">
  <meta name="theme-color" content="#A142F4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #A142F4; }
    .sidebar { border-right: 1px solid #e8eaed; }
    .app-name-link { font-weight: 700; }
    .markdown-section { max-width: 920px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section img { vertical-align: middle; }
  </style>
</head>
<body>
  <div id="app">Loading Women in Tech...</div>

  <script>
    window.$docsify = {
      name: '👩🏾‍💻 Women in Tech',
      repo: 'GDG-TUM/women-in-tech',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Search Women in Tech',
        noData: 'No results found.',
        depth: 3
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true });</script>
